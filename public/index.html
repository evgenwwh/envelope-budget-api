<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Budget <small id="total">$0.00</small></h1>

  <p id="error" class="error" hidden></p>

  <div class="block">
    <h3>Add envelope</h3>
    <form id="create-form">
      <input name="title" placeholder="Envelope name" required>
      <input name="budget" type="number" min="0" step="0.01" placeholder="0.00" required>
      <button>Add</button>
    </form>
  </div>

  <div class="block">
    <h3>Envelopes</h3>
    <table>
      <thead>
        <tr>
          <th>Envelope</th>
          <th class="money">Balance</th>
          <th>Spend</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="envelopes"></tbody>
    </table>
    <p id="empty" class="hint">Nothing here yet, add your first envelope above.</p>
  </div>

  <div class="tools">
    <form id="transfer-form" class="block">
      <h3>Move money</h3>
      <select name="from"></select> to <select name="to"></select>
      <input name="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required>
      <br><br>
      <button>Move</button>
    </form>

    <form id="distribute-form" class="block">
      <h3>Split money</h3>
      <div id="distribute-list"></div>
      <input name="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required>
      <button>Split</button>
    </form>
  </div>

  <div class="block">
    <h3>Transactions</h3>
    <form id="transaction-form">
      <select name="envelopeId"></select>
      <input name="recipient" placeholder="Paid to" required>
      <input name="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required>
      <input name="date" type="date" required>
      <button>Add</button>
    </form>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Paid to</th>
          <th>Envelope</th>
          <th class="money">Amount</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="transactions"></tbody>
    </table>
    <p id="no-transactions" class="hint">No transactions yet.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
